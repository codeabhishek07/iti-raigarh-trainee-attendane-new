<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1754b8">
<meta name="description" content="Daily attendance and leave management portal for Government ITI Raigarh, Chhattisgarh.">
<title>ITI Raigarh Attendance</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --blue:#1754b8;--blue-dark:#0f3d8a;--blue-soft:#eef5ff;--blue-line:#cfe0fb;
  --navy:#172b4d;--bg:#f4f7fb;--card:#fff;--line:#e2e9f3;--text:#22324a;--muted:#6b7b91;
  --green:#15805a;--green-soft:#e8f7f0;--red:#c23a48;--red-soft:#fff0f2;
  --amber:#9a6412;--amber-soft:#fff6e6;--radius:14px;
  --shadow:0 1px 2px rgba(23,43,77,.04),0 6px 18px rgba(23,43,77,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
h1,h2,h3,p{margin:0;overflow-wrap:anywhere}
svg{width:19px;height:19px;flex:none}
code{font-family:ui-monospace,Menlo,Consolas,monospace}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:grid;gap:16px}
.grid{display:grid;gap:16px}
.g-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
.g-even{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-title{margin:0;color:var(--navy);font-size:15px;font-weight:700}
.card-sub{margin:2px 0 0;color:var(--muted);font-size:12px}
.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:12px;background:var(--blue);color:#fff}
.brand-mark svg{width:22px;height:22px}
.brand-name{font-weight:800;color:var(--navy);letter-spacing:-.2px;line-height:1.2}
.brand-sub{font-size:11px;color:var(--muted);font-weight:600}
.btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border:1px solid transparent;border-radius:9px;background:#fff;color:#3b4d66;font-weight:700;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--blue-dark)}
.btn-outline{color:var(--blue);border-color:#d3e0f2}
.btn-outline:hover:not(:disabled){background:var(--blue-soft)}
.btn-danger{color:var(--red);border-color:#f0cdd2}
.btn-danger:hover:not(:disabled){background:var(--red-soft)}
.btn-sm{min-height:32px;padding:5px 10px;font-size:12px}
.btn-block{width:100%}
.icon-btn{display:inline-grid;place-items:center;padding:6px;border:0;border-radius:8px;background:transparent;color:#66768d}
.icon-btn:hover{background:#eef3f9}
.control{width:100%;min-height:44px;padding:9px 12px;border:1px solid #cfdbea;border-radius:9px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.control{min-height:96px;resize:vertical}
.control:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,84,184,.14)}
.field{margin-bottom:14px}
.field label,.label-text{display:block;margin-bottom:6px;color:#34465f;font-size:12px;font-weight:700}
.req{color:var(--red)}
.hint{margin-top:5px;color:var(--muted);font-size:11.5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.filters .field{margin:0;flex:1 1 170px;min-width:150px}
.search{max-width:300px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.green{color:#14744f;background:var(--green-soft)}
.badge.red{color:#b53541;background:var(--red-soft)}
.badge.amber{color:#8c5d10;background:var(--amber-soft)}
.badge.blue{color:#245aa7;background:var(--blue-soft)}
.badge.gray{color:#5f6f84;background:#eef2f6}
.avatar{width:36px;height:36px;display:grid;place-items:center;flex:none;border-radius:10px;background:#e6efff;color:var(--blue);font-weight:800;font-size:13px}
.avatar.sm{width:32px;height:32px}
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice-grid.two{grid-template-columns:1fr 1fr}
.choice{position:relative;display:block;cursor:pointer}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice-body{display:block;height:100%;padding:12px 8px;border:1px solid #d3deec;border-radius:10px;background:#fff;text-align:center;font-weight:700;color:#3d4f67;transition:border-color .15s,background .15s}
.choice-body small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.choice input:focus-visible+.choice-body{box-shadow:0 0 0 3px rgba(23,84,184,.2)}
.choice input:checked+.choice-body{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.choice input:checked+.choice-body small{color:#4d74b0}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(320px,44%) 1fr;background:#fff}
.auth-aside{display:flex;flex-direction:column;justify-content:space-between;gap:30px;padding:clamp(28px,4vw,64px);background:linear-gradient(150deg,#0f3d8a,#1754b8);color:#fff}
.auth-aside .brand-mark{background:#fff;color:var(--blue)}
.auth-aside .brand-name{color:#fff}
.auth-aside .brand-sub{color:#bcd3f7}
.auth-copy h1{font-size:clamp(28px,3.3vw,42px);line-height:1.15;letter-spacing:-1px;margin-bottom:14px}
.auth-copy>p{color:#d7e6ff;max-width:480px}
.feature-list{display:grid;gap:12px;margin-top:30px}
.feature{display:flex;align-items:center;gap:12px;color:#eaf2ff}
.feature svg{width:34px;height:34px;padding:7px;border-radius:9px;background:rgba(255,255,255,.14)}
.auth-foot{font-size:12px;color:#bcd3f7}
.auth-main{display:flex;align-items:center;justify-content:center;padding:32px 22px}
.auth-box{width:min(100%,430px)}
.auth-box h2{margin:6px 0 4px;color:var(--navy);font-size:28px;letter-spacing:-.7px}
.tabs{display:flex;margin:24px 0 20px;padding:4px;border-radius:11px;background:#f0f5fb}
.tabs button{flex:1;padding:10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:700}
.tabs button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(23,43,77,.08)}
.demo{margin-top:18px;padding:13px 15px;border:1px solid var(--blue-line);border-radius:10px;background:var(--blue-soft);color:#38527a;font-size:12px}
.demo code{padding:1px 6px;border-radius:5px;background:#fff;color:var(--navy)}
.footnote{margin-top:24px;color:#8794a5;font-size:11px}
.auth-main .footnote{position:absolute;bottom:14px;left:0;right:0;text-align:center}
.auth-main{position:relative}

/* Layout */
.layout{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;background:#fff;border-right:1px solid var(--line)}
.sidebar .brand{padding:0 8px}
.side-label{margin:30px 12px 8px;color:#8b98aa;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}
.nav{display:grid;gap:4px}
.nav-btn{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:9px;background:transparent;color:#566980;font-weight:650;text-align:left}
.nav-btn:hover{background:#f3f7fc}
.nav-btn.active{background:var(--blue-soft);color:var(--blue)}
.nav-count{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:20px;background:var(--blue);color:#fff;font-size:11px;text-align:center}
.side-bottom{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.profile{display:flex;align-items:center;gap:10px;min-width:0;padding:0 4px 8px}
.profile .min{min-width:0}
.profile b,.profile small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile small{color:var(--muted);font-size:11px}
.workspace{min-width:0}
.topbar{position:sticky;top:0;z-index:20;height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(16px,3vw,34px);background:#fff;border-bottom:1px solid var(--line)}
.topbar-title{color:var(--navy);font-weight:800}
.topbar-right{display:flex;align-items:center;gap:8px}
.mobile-nav{display:none}
.content{max-width:1280px;margin:0 auto;padding:28px clamp(16px,3vw,34px) 50px}
.banner{margin-bottom:16px}

/* Page */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.page-head h1{margin:2px 0;color:var(--navy);font-size:24px;letter-spacing:-.6px}
.page-head p{color:var(--muted);font-size:13px}
.actions,.action-group{display:flex;flex-wrap:wrap;gap:8px}
.stat{display:flex;align-items:center;gap:13px;min-height:94px;padding:18px}
.stat-icon{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:11px;background:var(--blue-soft);color:var(--blue)}
.stat-icon.green{background:var(--green-soft);color:var(--green)}
.stat-icon.amber{background:var(--amber-soft);color:var(--amber)}
.stat-icon.red{background:var(--red-soft);color:var(--red)}
.stat-value{color:var(--navy);font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.4px}
.stat-label{margin-top:3px;color:var(--muted);font-size:12px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 26px;border-radius:15px;background:linear-gradient(110deg,#0f3d8a,#2466c8);color:#fff;box-shadow:0 10px 26px rgba(23,84,184,.2)}
.hero h2{margin:6px 0 4px;font-size:22px;letter-spacing:-.5px}
.hero p{color:#d6e6ff;font-size:13px}
.hero .btn{flex:none;background:#fff;color:var(--blue)}
.tag{display:inline-block;padding:4px 10px;border-radius:7px;background:rgba(255,255,255,.14);font-size:11px;font-weight:700}
.chart{position:relative;height:240px}
.chart-donut{position:relative;height:200px}
.doughnut-wrap{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:3px;vertical-align:-1px}
.list-item{padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.cell-main{color:var(--navy);font-weight:700}
.cell-sub{color:var(--muted);font-size:11.5px}
.pct b{font-size:13px}
.text-red{color:var(--red)}
.text-green{color:var(--green)}
.progress{height:7px;margin-top:6px;overflow:hidden;border-radius:99px;background:#edf2f8}
.progress span{display:block;height:100%;border-radius:inherit;background:var(--blue)}
.progress.low span{background:var(--red)}
.balance{padding:12px 0;border-bottom:1px solid var(--line)}
.balance:last-child{border-bottom:0}
.callout,.notice,.success-box{padding:12px 14px;border-radius:10px;font-size:12.5px}
.callout{margin-top:14px;border:1px solid var(--blue-line);background:var(--blue-soft);color:#2f4f80}
.notice{margin-top:14px;border:1px solid #f1dfb3;background:var(--amber-soft);color:#6b4b12}
.success-box{border:1px solid #bfe6d4;background:var(--green-soft);color:#1d6a4b}
.empty{padding:28px 14px;color:var(--muted);text-align:center}
.mini{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafcff}
.mini-value{color:var(--navy);font-size:18px;font-weight:800}
.mini-label{color:var(--muted);font-size:11px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.report-card{display:flex;flex-direction:column;gap:10px}
.report-card h3{color:var(--navy);font-size:15px}
.report-card .action-group{margin-top:auto}
.icon-tile{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;background:var(--blue-soft);color:var(--blue)}

/* Tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{padding:11px 14px;border-bottom:1px solid var(--line);background:#f7f9fc;color:#73839a;font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid #eef2f7;font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcff}

/* Modal, toasts */
.modal-backdrop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(15,32,57,.5)}
.modal{width:min(100%,620px);max-height:92vh;overflow:auto;border-radius:15px;background:#fff;box-shadow:0 24px 60px rgba(10,31,61,.3)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;color:var(--navy);font-size:16px}
.modal-body{padding:20px}
.modal-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:16px}
.detail{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.detail:last-child{border-bottom:0}
.toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:grid;gap:8px}
.toast{max-width:min(360px,calc(100vw - 32px));padding:12px 15px;border-radius:9px;background:#172b4d;color:#fff;box-shadow:0 10px 26px rgba(10,31,61,.25);font-size:13px}
.toast.error{background:#a93843}
.fatal{max-width:520px;margin:12vh auto;padding:24px}

/* Forms in leave application */
#leave-form[data-type="Half-Day"] .not-half{display:none}
#signup-form[data-role="trainee"] .only-admin{display:none}
#signup-form[data-role="admin"] .only-trainee{display:none}

/* Responsive */
@media (max-width:1050px){
  .g-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2{grid-template-columns:1fr}
}
@media (max-width:820px){
  .auth{grid-template-columns:1fr}
  .auth-aside{gap:18px;padding:24px}
  .auth-copy h1{font-size:24px}
  .feature-list,.auth-foot{display:none}
  .auth-main{align-items:flex-start;padding:26px 18px 56px}
  .layout{display:block}
  .sidebar{display:none}
  .mobile-nav{position:relative;display:flex;gap:4px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff;scrollbar-width:none}
  .mobile-nav::-webkit-scrollbar{display:none}
  .mobile-nav .nav-btn{width:auto;flex:none;padding:8px 11px;font-size:12.5px}
  .mobile-nav .nav-btn svg{width:15px;height:15px}
  .g-even{grid-template-columns:1fr}
  .topbar-date{display:none}
  .content{padding:20px 14px 40px}
}
@media (max-width:580px){
  .g-stats{gap:10px}
  .stat{min-height:0;gap:10px;padding:14px}
  .stat-icon{width:36px;height:36px}
  .stat-value{font-size:19px}
  .form-grid{grid-template-columns:1fr}
  .choice-grid{gap:8px}
  .choice-body{padding:10px 4px;font-size:12px}
  .hero{flex-direction:column;align-items:flex-start;padding:20px}
  .hero h2{font-size:20px}
  .page-head{flex-direction:column;align-items:stretch}
  .page-head h1{font-size:21px}
  .filters .field{min-width:0;flex:1 1 140px}
  .search{max-width:none}
  .card-pad{padding:16px}
  .doughnut-wrap{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr 1fr}
  .modal-backdrop{align-items:end;padding:0}
  .modal{width:100%;max-height:90vh;border-radius:16px 16px 0 0}
  .table-wrap thead{display:none}
  .table-wrap table,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block;width:100%}
  .table-wrap tr{padding:12px 14px;border-bottom:1px solid #eef2f7}
  .table-wrap td{padding:4px 0;border:0}
  .table-wrap td::before{content:attr(data-label);display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}
  .table-wrap td[data-label=""]::before{display:none}
  .table-wrap tbody tr:hover{background:none}
  .table-wrap td .action-group{margin-top:6px}
}
@media print{
  .sidebar,.mobile-nav,.topbar,.actions,.btn,.footnote{display:none!important}
  .layout{display:block}
  .content{max-width:none;padding:0}
  .card{box-shadow:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
"use strict";

/* ============================================================
   Configuration
   ============================================================ */
const DB_KEY="iti_raigarh_attendance_v6";
const LOCK_KEY="iti_raigarh_lock_v6";
const SESSION_KEY="iti_raigarh_session_v6";
const PBKDF2_ITER=120000;
const IDLE_MS=30*60*1000;
const WINDOW={start:8,end:12};
const WINDOW_TEXT="8:00 AM to 12:00 noon";
const LOCATIONS=["Classroom","Workshop","Lab"];
const LEAVE_MAX={Casual:12,Medical:36};
const LOW_THRESHOLD=75;

/* ============================================================
   Storage (falls back to memory where browser storage is blocked)
   ============================================================ */
function makeStore(kind){
  const mem={};
  const s=()=>window[kind];
  return {
    get(k){try{return s().getItem(k)}catch(e){return k in mem?mem[k]:null}},
    set(k,v){try{s().setItem(k,v)}catch(e){mem[k]=String(v)}},
    del(k){try{s().removeItem(k)}catch(e){delete mem[k]}}
  };
}
const store=makeStore("localStorage");
const session=makeStore("sessionStorage");

/* ============================================================
   Generic helpers
   ============================================================ */
const $=(sel,root=document)=>root.querySelector(sel);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const uid=()=>globalThis.crypto?.randomUUID?crypto.randomUUID():"id_"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const parseDate=iso=>new Date(String(iso).slice(0,10)+"T12:00:00");
const localDate=d=>{const x=new Date(d);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`};
const today=()=>localDate(new Date());
const addDays=(iso,n)=>{const d=parseDate(iso);d.setDate(d.getDate()+n);return localDate(d)};
const daysBetween=(a,b)=>Math.round((parseDate(b)-parseDate(a))/86400000)+1;
const fmtDate=iso=>iso?parseDate(iso).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"—";
const fmtMonth=ym=>parseDate(ym+"-01").toLocaleDateString("en-IN",{month:"long",year:"numeric"});
const monthEnd=ym=>localDate(new Date(+ym.slice(0,4),+ym.slice(5),0));
const monthDays=ym=>+monthEnd(ym).slice(8);
const dayName=iso=>parseDate(iso).toLocaleDateString("en-IN",{weekday:"short"});
const isSunday=iso=>parseDate(iso).getDay()===0;
const initials=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const nowTime=()=>new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true});
const later=(a,b)=>a>b?a:b;
const earlier=(a,b)=>a<b?a:b;
const cap=s=>String(s??"").charAt(0).toUpperCase()+String(s??"").slice(1);
const val=(f,n)=>String(f.get(n)??"").trim();
const byApplied=(a,b)=>b.appliedAt-a.appliedAt;
const byRoll=(a,b)=>String(a.rollNo).localeCompare(String(b.rollNo),undefined,{numeric:true});
const rangeText=l=>l.fromDate===l.toDate?fmtDate(l.fromDate):`${fmtDate(l.fromDate)} – ${fmtDate(l.toDate)}`;

/* ============================================================
   Cryptography: PBKDF2 when available, pure-JS SHA-256 fallback
   ============================================================ */
const enc=new TextEncoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=buf=>Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,"0")).join("");
const concat=(...arrs)=>{const n=arrs.reduce((s,a)=>s+a.length,0);const out=new Uint8Array(n);let o=0;for(const a of arrs){out.set(a,o);o+=a.length}return out};
const PRIMES=[];
for(let n=2;PRIMES.length<64;n++){if(PRIMES.every(p=>n%p))PRIMES.push(n)}
const frac32=x=>Math.floor((x-Math.floor(x))*4294967296)>>>0;
const K256=PRIMES.map(p=>frac32(Math.cbrt(p)));
const H256=PRIMES.slice(0,8).map(p=>frac32(Math.sqrt(p)));
function sha256(msg){
  const l=msg.length,bitLen=l*8;
  const padLen=((l+9+63)>>6)<<6;
  const buf=new Uint8Array(padLen);
  buf.set(msg);buf[l]=0x80;
  const dv=new DataView(buf.buffer);
  dv.setUint32(padLen-8,Math.floor(bitLen/4294967296));
  dv.setUint32(padLen-4,bitLen>>>0);
  const H=H256.slice();const W=new Uint32Array(64);
  const rotr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let off=0;off<padLen;off+=64){
    for(let i=0;i<16;i++)W[i]=dv.getUint32(off+i*4);
    for(let i=16;i<64;i++){
      const s0=rotr(W[i-15],7)^rotr(W[i-15],18)^(W[i-15]>>>3);
      const s1=rotr(W[i-2],17)^rotr(W[i-2],19)^(W[i-2]>>>10);
      W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(h+S1+ch+K256[i]+W[i])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    const vals=[a,b,c,d,e,f,g,h];
    for(let k=0;k<8;k++)H[k]=(H[k]+vals[k])>>>0;
  }
  const out=new Uint8Array(32);const odv=new DataView(out.buffer);
  H.forEach((v,i)=>odv.setUint32(i*4,v));
  return out;
}
async function hashPassword(password,saltB64,kdf){
  const canSubtle=!!globalThis.crypto?.subtle;
  if(!kdf) kdf=canSubtle?"PBKDF2":"SHA256-ITER";
  if(kdf==="PBKDF2"&&!canSubtle) throw new Error("This account requires a secure browser context (HTTPS or localhost).");
  const salt=saltB64?unb64(saltB64):crypto.getRandomValues(new Uint8Array(16));
  const pw=enc.encode(password);
  if(kdf==="PBKDF2"){
    const key=await crypto.subtle.importKey("raw",pw,"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:PBKDF2_ITER,hash:"SHA-256"},key,256);
    return {salt:b64(salt),kdf,passwordHash:hex(bits)};
  }
  let h=sha256(concat(salt,pw));
  for(let i=0;i<20000;i++) h=sha256(concat(h,salt,pw));
  return {salt:b64(salt),kdf,passwordHash:hex(h)};
}

/* Dates on which the trainee holds approved leave */
function leaveDatesFor(id){
  const set=new Set();
  for(const l of db.leaves){
    if(l.traineeId!==id||l.status!=="approved") continue;
    for(let d=l.fromDate,g=0;d<=l.toDate&&g<400;d=addDays(d,1),g++) set.add(d);
  }
  return set;
}
function dayInfo(id,date,leaveSet=leaveDatesFor(id)){
  const r=records(id).find(a=>a.date===date);
  if(r) return {status:"present",location:r.location,time:r.time};
  if(leaveSet.has(date)) return {status:"leave"};
  if(isSunday(date)) return {status:"holiday"};
  return {status:"unmarked"};
}
/* Latest date for which attendance is final (window closes at noon) */
const cutoffDate=()=>new Date().getHours()>=WINDOW.end?today():addDays(today(),-1);

/* Attendance percentage: present days / scheduled working days (Sundays and approved leave excluded) */
function periodStats(id,from,to){
  const leaves=leaveDatesFor(id);
  const marked=new Set(records(id).map(r=>r.date));
  let scheduled=0,present=0,absent=0;
  if(from<=to){
    for(let d=from,g=0;d<=to&&g<4000;d=addDays(d,1),g++){
      if(isSunday(d)||leaves.has(d)) continue;
      scheduled++;
      if(marked.has(d)) present++; else absent++;
    }
  }
  return {scheduled,present,absent,pct:scheduled?Math.round(present/scheduled*100):null};
}
function attendanceOf(id){
  const t=user(id);
  return periodStats(id,t.joinedDate||today(),cutoffDate());
}
const pctOf=id=>attendanceOf(id).pct;

/* Leave balance per calendar year. Half-day leave is deducted from Casual leave. */
function leaveBalance(id,type,includePending=false){
  const year=String(new Date().getFullYear());
  const max=LEAVE_MAX[type];
  const groups=type==="Casual"?["Casual","Half-Day"]:[type];
  const used=db.leaves
    .filter(l=>l.traineeId===id&&groups.includes(l.type)&&l.fromDate.startsWith(year)&&(l.status==="approved"||(includePending&&l.status==="pending")))
    .reduce((s,l)=>s+l.days,0);
  return {max,used,left:Math.max(0,max-used)};
}
function historyRows(t){
  const leaves=leaveDatesFor(t.id),out=[],cutoff=cutoffDate();
  for(let d=t.joinedDate,g=0;d<=cutoff&&g<4000;d=addDays(d,1),g++){
    const i=dayInfo(t.id,d,leaves);
    out.push([fmtDate(d),dayName(d),STATUS_TEXT[i.status],i.location||"—",i.time||"—"]);
  }
  return out.reverse();
}

function adminDashboard(){

  const labels=[],values=[];
  for(let i=6;i>=0;i--){

async function saveTrainee(form){
  if(!isAdmin()||modalCtx?.type!=="trainee") throw new Error("Session expired. Please try again.");
  const old=modalCtx.id?ownTrainee(modalCtx.id):null;
  if(modalCtx.id&&!old) throw new Error("Trainee not found in your Trade.");
  const f=new FormData(form);
  const v={name:val(f,"name"),rollNo:val(f,"rollNo"),username:val(f,"username").toLowerCase(),mobile:val(f,"mobile")};
  const password=String(f.get("password")||"");
  if(v.name.length<2) throw new Error("Enter the trainee's full name.");
  if(!v.rollNo) throw new Error("Enter a roll number.");
  if(!/^[a-z0-9._-]{3,30}$/.test(v.username)) throw new Error("Username must be 3–30 characters: letters, numbers, dot, dash or underscore.");
  if(db.users.some(u=>u.id!==old?.id&&u.username===v.username)) throw new Error("That username is already in use.");
  if(ownTrainees().some(u=>u.id!==old?.id&&u.rollNo.toLowerCase()===v.rollNo.toLowerCase())) throw new Error("This roll number already exists in your Trade.");
  if(v.mobile&&!/^\d{10}$/.test(v.mobile)) throw new Error("Enter a valid 10-digit mobile number.");
  if(password&&password.length<8) throw new Error("Password must contain at least 8 characters.");
  if(!old&&!password) throw new Error("A password is required for a new trainee.");
  if(old){
    Object.assign(old,v);
    if(password) Object.assign(old,await hashPassword(password));
    audit("Trainee updated",old.username);
    flash("Trainee updated.");
  }else{
    const acc={id:uid(),role:"trainee",tradeId:me.tradeId,active:true,verified:true,joinedDate:today(),...v,...(await hashPassword(password))};
    db.users.push(acc);
    notify(acc.id,"Your trainee account has been created. Welcome to ITI Raigarh Attendance.");
    audit("Trainee created",v.username);
    flash("Trainee account created.");
  }
  save();closeModal();render();
}

function saveReview(form,submitter){
  if(!isAdmin()||modalCtx?.type!=="review") throw new Error("Session expired. Please try again.");
  const decision=submitter?.value;
  if(!["approved","rejected"].includes(decision)) throw new Error("Choose Approve or Reject.");
  const leave=ownLeaves().find(l=>l.id===modalCtx.id&&l.status==="pending");
  if(!leave) throw new Error("This request is no longer pending.");
  if(decision==="approved"){
    const group=leave.type==="Half-Day"?"Casual":leave.type;
    if(LEAVE_MAX[group]){
      const b=leaveBalance(leave.traineeId,group);
      if(b.used+leave.days>b.max) throw new Error(`Approval would exceed the ${group} leave allowance (${b.left} day(s) left).`);
    }
  }
  const remarks=val(new FormData(form),"remarks").slice(0,300);
  leave.status=decision;leave.decidedAt=Date.now();leave.decidedBy=me.id;leave.remarks=remarks;
  notify(leave.traineeId,`Your ${leave.type} leave (${rangeText(leave)}) was ${decision}.${remarks?" Remarks: "+remarks:""}`,decision==="approved"?"green":"red");
  audit("Leave "+decision,leave.id);

  if(h<WINDOW.start||h>=WINDOW.end) throw new Error(`Attendance can be marked only from ${WINDOW_TEXT}.`);
  const loc=val(new FormData(form),"location");
  if(!LOCATIONS.includes(loc)) throw new Error("Select your location.");
  if(records(me.id).some(a=>a.date===today())) throw new Error("Attendance is already recorded for today.");
  if(leaveDatesFor(me.id).has(today())) throw new Error("You have approved leave today.");
  db.attendance.push({id:uid(),traineeId:me.id,date:today(),status:"present",location:loc,time:nowTime(),createdAt:Date.now()});
  notify(me.id,`Attendance recorded for ${fmtDate(today())} at ${loc}.`,"green");
  audit("Attendance marked",today());
  save();ui.section="dashboard";render();flash("Attendance marked. Thank you!");

function submitLeave(form){
  if(isAdmin()) throw new Error("Training Officers review leave; trainees apply for it.");
  const f=new FormData(form);
  const type=val(f,"type");
  const from=val(f,"fromDate");
  let to=val(f,"toDate");
  const reason=val(f,"reason");
  const dateRe=/^\d{4}-\d{2}-\d{2}$/;
  if(!["Casual","Medical","Half-Day"].includes(type)) throw new Error("Choose a leave type.");
  if(!dateRe.test(from)) throw new Error("Choose a valid start date.");
  if(type==="Half-Day"){
    if(from!==today()) throw new Error("Half-day leave can be applied for today only.");
    to=from;
  }else{
    if(!dateRe.test(to)) throw new Error("Choose a valid end date.");
    if(to<from) throw new Error("The end date cannot be before the start date.");
  }
  if(reason.length<5) throw new Error("Please give a reason (at least 5 characters).");
  const days=type==="Half-Day"?0.5:daysBetween(from,to);
  if(type!=="Half-Day"&&days>LEAVE_MAX[type]) throw new Error(`${type} leave cannot exceed ${LEAVE_MAX[type]} days in one application.`);
  const group=type==="Half-Day"?"Casual":type;
  const b=leaveBalance(me.id,group,true);
  if(days>b.left) throw new Error(`Insufficient ${group} leave: ${b.left} day(s) remain, including pending requests.`);
  if(db.leaves.some(l=>l.traineeId===me.id&&!["rejected","withdrawn"].includes(l.status)&&from<=l.toDate&&to>=l.fromDate)) throw new Error("These dates overlap an existing leave request.");
  const leave={id:uid(),traineeId:me.id,type,fromDate:from,toDate:to,days,reason,status:"pending",appliedAt:Date.now(),decidedAt:null,decidedBy:"",remarks:""};
  db.leaves.push(leave);
  db.users.filter(u=>u.role==="admin"&&u.active&&u.tradeId===me.tradeId).forEach(o=>notify(o.id,`${me.name} applied for ${type} leave (${days} day${days>1?"s":""}).`,"amber"));
  notify(me.id,`Your ${type} leave application for ${fmtDate(from)} was submitted.`);
  audit("Leave applied",leave.id);
  save();ui.section="leaves";render();flash("Leave application submitted.");
}
function saveTrade(form){
  if(!isAdmin()) throw new Error("Only Training Officers can edit a Trade.");
  const t=trade(me.tradeId);
  const f=new FormData(form);
  const name=val(f,"name"),code=val(f,"code").toUpperCase();
  if(name.length<2) throw new Error("Enter a Trade name.");
  if(!/^[A-Z0-9-]{2,12}$/.test(code)) throw new Error("Trade code must be 2–12 letters, numbers or dashes.");
  if(db.trades.some(x=>x.id!==t.id&&(x.name.toLowerCase()===name.toLowerCase()||x.code===code))) throw new Error("Another Trade already uses that name or code.");
  t.name=name;t.code=code;
  audit("Trade updated",code);
  save();render();flash("Trade details updated.");
}

async function handleLogin(form){
  const f=new FormData(form);
  const username=val(f,"username").toLowerCase();
  const password=String(f.get("password")||"");
  const lock=JSON.parse(store.get(LOCK_KEY)||"null")||{n:0,until:0};
  if(Date.now()<lock.until) throw new Error(`Too many failed attempts. Try again in ${Math.ceil((lock.until-Date.now())/1000)} seconds.`);
  const acc=db.users.find(u=>u.username===username);
  const ok=!!acc&&(await hashPassword(password,acc.salt,acc.kdf)).passwordHash===acc.passwordHash;
  if(!ok){
    lock.n++;
    if(lock.n>=5){lock.until=Date.now()+60000;lock.n=0}
    store.set(LOCK_KEY,JSON.stringify(lock));
    throw new Error("Invalid username or password.");
  }
  if(!acc.active) throw new Error("This account is inactive. Please contact your Training Officer.");
  store.del(LOCK_KEY);
  signIn(acc);
  flash(`Welcome, ${acc.name.split(" ")[0]}.`);
}
async function handleSignup(form){
  const f=new FormData(form);
  const role=val(f,"role");
  const name=val(f,"name");
  const tradeId=val(f,"tradeId");
  const username=val(f,"username").toLowerCase();
  const mobile=val(f,"mobile");
  const rollNo=val(f,"rollNo");
  const password=String(f.get("password")||"");
  const confirm=String(f.get("confirm")||"");
  if(!["admin","trainee"].includes(role)) throw new Error("Choose an account type.");
  if(name.length<2) throw new Error("Enter your full name.");
  if(!trade(tradeId)) throw new Error("Select your Trade.");
  if(!/^[a-z0-9._-]{3,30}$/.test(username)) throw new Error("Username must be 3–30 characters: letters, numbers, dot, dash or underscore.");
  if(db.users.some(u=>u.username===username)) throw new Error("That username is already in use.");
  if(role==="trainee"){
    if(!rollNo) throw new Error("Enter your roll number.");
    if(db.users.some(u=>u.role==="trainee"&&u.tradeId===tradeId&&u.rollNo.toLowerCase()===rollNo.toLowerCase())) throw new Error("This roll number is already registered in the selected Trade.");
  }
  if(mobile&&!/^\d{10}$/.test(mobile)) throw new Error("Enter a valid 10-digit mobile number.");
  if(password.length<8) throw new Error("Password must contain at least 8 characters.");
  if(password!==confirm) throw new Error("The passwords do not match.");
  const acc={id:uid(),role,tradeId,name,username,mobile,rollNo:role==="trainee"?rollNo:"",active:true,verified:role==="trainee",joinedDate:today(),...(await hashPassword(password))};
  db.users.push(acc);
  notify(acc.id,"Welcome to ITI Raigarh Attendance.");
  audit("Account created",username);
  signIn(acc);
  flash(role==="admin"?"Officer account created. Institutional verification is pending.":"Account created successfully.");
}
function logout(){
  me=null;
  session.del(SESSION_KEY);
  ui.auth="login";ui.section="dashboard";
  closeModal();
  render();
}

/* ============================================================
   Reports (PDF and Excel)
   ============================================================ */
function buildReport(kind){
  const cutoff=cutoffDate();
  const tName=trade(me.tradeId)?.name||"";
  if(!isAdmin()){
    if(kind==="mine"){
      const pct=attendanceOf(me.id).pct;
      return {key:"my_attendance",title:"My attendance history",subtitle:`${me.name} · Roll ${me.rollNo} · ${tName} · Attendance ${pct==null?"—":pct+"%"}`,headers:["Date","Day","Status","Location","Time"],rows:historyRows(me)};
    }
    if(kind==="myleaves"){
      return {key:"my_leaves",title:"My leave history",subtitle:`${me.name} · Roll ${me.rollNo} · ${tName}`,headers:["Type","From","To","Days","Reason","Applied","Status","Remarks"],
        rows:db.leaves.filter(l=>l.traineeId===me.id).sort(byApplied).map(l=>[l.type,fmtDate(l.fromDate),fmtDate(l.toDate),l.days,l.reason,fmtDate(localDate(l.appliedAt)),cap(l.status),l.remarks||""])};
    }
    throw new Error("This report is not available for your account.");
  }
  const roster=ownTrainees().sort(byRoll);
  const sub=`Trade: ${tName}`;
  switch(kind){
    case "summary": {
      const from=ui.reportFrom,to=ui.reportTo;
      if(from>to) throw new Error("The From date must be before the To date.");
      return {key:"attendance_summary",title:"Attendance summary",subtitle:`Period: ${fmtDate(from)} – ${fmtDate(to)} · ${sub}`,
        headers:["Roll No","Name","Scheduled days","Present","Absent","Attendance %"],
        rows:roster.map(t=>{const s=periodStats(t.id,later(from,t.joinedDate),earlier(to,cutoff));return [t.rollNo,t.name,s.scheduled,s.present,s.absent,s.pct==null?"—":s.pct+"%"]})};
    }
    case "daily": {
      const date=ui.date;
      return {key:"daily_attendance",title:"Daily attendance register",subtitle:`Date: ${fmtDate(date)} · ${sub}`,headers:["Roll No","Name","Status","Location","Time"],
        rows:roster.map(t=>{const i=dayInfo(t.id,date);return [t.rollNo,t.name,STATUS_TEXT[i.status],i.location||"—",i.time||"—"]})};
    }
    case "monthly": {
      const ym=ui.reportMonth;
      return {key:"monthly_attendance",title:"Monthly attendance summary",subtitle:`Month: ${fmtMonth(ym)} · ${sub}`,headers:["Roll No","Name","Scheduled days","Present","Absent","Attendance %"],
        rows:roster.map(t=>{const s=periodStats(t.id,later(ym+"-01",t.joinedDate),earlier(monthEnd(ym),cutoff));return [t.rollNo,t.name,s.scheduled,s.present,s.absent,s.pct==null?"—":s.pct+"%"]})};
    }
    case "individual": {
      const t=ownTrainee(ui.reportTrainee);
      if(!t) throw new Error("Select a trainee in the filter bar first.");
      const pct=attendanceOf(t.id).pct;
      return {key:"individual_record",title:"Individual attendance record",subtitle:`${t.name} · Roll ${t.rollNo} · Attendance ${pct==null?"—":pct+"%"} · ${sub}`,headers:["Date","Day","Status","Location","Time"],rows:historyRows(t)};
    }
    case "leaves": {
      const from=ui.reportFrom,to=ui.reportTo;
      return {key:"leave_applications",title:"Leave applications",subtitle:`Period: ${fmtDate(from)} – ${fmtDate(to)} · ${sub}`,headers:["Trainee","Roll No","Type","From","To","Days","Status","Reason"],
        rows:ownLeaves().filter(l=>l.toDate>=from&&l.fromDate<=to).sort(byApplied).map(l=>{const t=user(l.traineeId);return [t?.name,t?.rollNo,l.type,fmtDate(l.fromDate),fmtDate(l.toDate),l.days,cap(l.status),l.reason]})};
    }
    case "trainees":
      return {key:"trainee_roster",title:"Trainee roster",subtitle:sub,headers:["Roll No","Name","Username","Mobile","Joined","Attendance %","Status"],
        rows:roster.map(t=>[t.rollNo,t.name,t.username,t.mobile||"",fmtDate(t.joinedDate),pctOf(t.id)==null?"—":pctOf(t.id)+"%",t.active?"Active":"Inactive"])};
    case "low":
      return {key:"low_attendance",title:"Low attendance",subtitle:`Below ${LOW_THRESHOLD}% · ${sub}`,headers:["Roll No","Name","Scheduled days","Present","Absent","Attendance %"],
        rows:roster.filter(t=>{const p=pctOf(t.id);return p!=null&&p<LOW_THRESHOLD}).map(t=>{const s=attendanceOf(t.id);return [t.rollNo,t.name,s.scheduled,s.present,s.absent,s.pct+"%"]})};
    case "warnings": {
      const ids=ownTraineeIds();
      return {key:"warnings",title:"Issued warnings",subtitle:sub,headers:["Date","Trainee","Roll No","Message","Issued by"],
        rows:db.warnings.filter(w=>ids.has(w.traineeId)).sort((a,b)=>b.createdAt-a.createdAt).map(w=>[fmtDate(localDate(w.createdAt)),user(w.traineeId)?.name,user(w.traineeId)?.rollNo,w.message,user(w.issuedBy)?.name])};
    }
    default:
      throw new Error("Unknown report.");
  }
}
function exportReport(spec,format){
  const name=`ITI_Raigarh_${spec.key}_${today()}`;
  const rows=spec.rows.length?spec.rows:[["No records for the selected filters"]];
  if(format==="pdf"){
    if(!window.jspdf||!window.jspdf.jsPDF) throw new Error("The PDF library could not load. Check your internet connection.");
    const doc=new window.jspdf.jsPDF({orientation:spec.headers.length>5?"landscape":"portrait",unit:"mm",format:"a4"});
    const width=doc.internal.pageSize.getWidth();
    doc.setFillColor(23,84,184);doc.rect(0,0,width,4,"F");
    doc.setTextColor(18,59,131);doc.setFontSize(15);doc.text("Government ITI Raigarh, Chhattisgarh",14,17);
    doc.setTextColor(23,43,77);doc.setFontSize(12);doc.text(spec.title,14,25);
    doc.setTextColor(95,105,120);doc.setFontSize(9);doc.text(spec.subtitle,14,31);
    doc.autoTable({
      startY:37,
      head:[spec.headers],
      body:rows.map(r=>r.map(x=>String(x??""))),
      theme:"grid",
      headStyles:{fillColor:[23,84,184],textColor:255},
      styles:{fontSize:8.5,cellPadding:2.6},
      alternateRowStyles:{fillColor:[246,249,253]},
      margin:{left:14,right:14},
      didDrawPage:()=>{
        doc.setFontSize(8);doc.setTextColor(120,130,145);
        doc.text(`Generated on ${fmtDate(today())} · Page ${doc.internal.getNumberOfPages()}`,14,doc.internal.pageSize.getHeight()-8);
      }
    });
    doc.save(name+".pdf");
  }else{
    if(!window.XLSX) throw new Error("The Excel library could not load. Check your internet connection.");
    const ws=XLSX.utils.aoa_to_sheet([[spec.title],[spec.subtitle],[],spec.headers,...rows]);
    ws["!cols"]=spec.headers.map((h,i)=>({wch:Math.min(45,Math.max(12,String(h).length+2,rows.reduce((m,r)=>Math.max(m,String(r[i]??"").length+2),0)))}));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Report");
    XLSX.writeFile(wb,name+".xlsx");
  }
  flash("Report downloaded.");
}

/* ============================================================
   Event handling
   ============================================================ */
const actions={
  setAuth:ds=>{ui.auth=ds.mode;render()},
  signupRole:(ds,el)=>{el.closest("form").dataset.role=el.value;ui.signupRole=el.value},
  go:ds=>{ui.section=ds.section;closeModal();render();window.scrollTo({top:0})},
  setUi:(ds,el)=>{ui[ds.key]=el.value;if(ds.rerender) render()},
  logout:()=>logout(),
  closeModal:()=>closeModal(),
  leaveType:(ds,el)=>{
    const f=el.closest("form");
    f.dataset.type=el.value;
    const from=f.elements.fromDate;
    if(el.value==="Half-Day"){from.value=today();from.min=today();from.max=today();}
    else{from.removeAttribute("min");from.removeAttribute("max");}
    updateLeaveHint(f);
  },
  leaveDates:(ds,el)=>updateLeaveHint(el.closest("form")),
  searchRows:(ds,el)=>{
    const term=el.value.trim().toLowerCase();
    document.querySelectorAll("[data-row]").forEach(r=>r.classList.toggle("hidden",!!term&&!r.dataset.search.includes(term)));
  },
  addTrainee:()=>openTraineeModal(),
  editTrainee:ds=>openTraineeModal(ds.id),
  viewTrainee:ds=>openTraineeView(ds.id),
  toggleTrainee:ds=>toggleTrainee(ds.id),
  openWarning:ds=>openWarningModal(ds.id),
  reviewLeave:ds=>openReviewModal(ds.id),
  withdrawLeave:ds=>withdrawLeave(ds.id),
  readNotice:ds=>{const n=db.notifications.find(x=>x.id===ds.id&&x.userId===me.id);if(n){n.read=true;save();render()}},
  readAll:()=>{myNotes().forEach(n=>n.read=true);save();render()},
  report:ds=>{exportReport(buildReport(ds.kind),ds.format)}
};
const formHandlers={
  "login-form":(f)=>handleLogin(f),
  "signup-form":(f)=>handleSignup(f),
  "trainee-form":(f)=>saveTrainee(f),
  "warning-form":(f)=>saveWarning(f),
  "review-form":(f,sub)=>saveReview(f,sub),
  "mark-form":(f)=>markAttendance(f),
  "leave-form":(f)=>submitLeave(f),
  "trade-form":(f)=>saveTrade(f)
};
function run(name,ds,el){
  try{actions[name]?.(ds,el)}
  catch(err){flash(err.message||"Something went wrong. Please try again.",true)}
}
document.addEventListener("click",e=>{
  if(e.target.classList?.contains("modal-backdrop")) return closeModal();
  const el=e.target.closest?.("[data-action]");
  if(!el||el.dataset.evt) return;
  run(el.dataset.action,el.dataset,el);
});
function dispatchEvt(e,evt){
  const el=e.target.closest?.("[data-action]");
  if(!el||el.dataset.evt!==evt) return;
  run(el.dataset.action,el.dataset,el);
}
document.addEventListener("change",e=>dispatchEvt(e,"change"));
document.addEventListener("input",e=>dispatchEvt(e,"input"));
document.addEventListener("submit",async e=>{
  const form=e.target;
  const handler=formHandlers[form.id];
  if(!handler) return;
  e.preventDefault();
  const btn=e.submitter||form.querySelector('[type="submit"]');
  if(btn) btn.disabled=true;
  try{
    await handler(form,e.submitter);
  }catch(err){
    flash(err.message||"Something went wrong. Please try again.",true);
  }finally{
    if(btn?.isConnected) btn.disabled=false;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modal-root").innerHTML) closeModal();
});
["pointerdown","keydown","touchstart"].forEach(ev=>document.addEventListener(ev,()=>{lastActive=Date.now()},{passive:true}));
setInterval(()=>{
  if(me&&Date.now()-lastActive>IDLE_MS){
    logout();
    flash("You were signed out after 30 minutes of inactivity.");
  }
},30000);

/* ============================================================
   Rendering
   ============================================================ */
function render(){
  charts.forEach(c=>c.destroy());
  charts=[];
  pending=[];
  if(me&&!me.active){me=null;session.del(SESSION_KEY)}
  if(!me){
    $("#app").innerHTML=authView();
  }else{
    const views=isAdmin()?ADMIN_VIEWS:TRAINEE_VIEWS;
    if(!views[ui.section]) ui.section="dashboard";
    $("#app").innerHTML=shell(views[ui.section]());
  }
  pending.forEach(({id,config})=>{
    const el=document.getElementById(id);
    if(el&&window.Chart) charts.push(new Chart(el,config));
  });
}

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  $("#app").innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;color:#1754b8;font-weight:700">Loading ITI Raigarh Attendance…</div>`;
  try{
    await seed();
    const raw=session.get(SESSION_KEY);
    if(raw){
      try{
        const saved=JSON.parse(raw);
        const acc=user(saved.id);
        if(acc?.active&&Date.now()-saved.at<IDLE_MS*4) me=acc;
        else session.del(SESSION_KEY);
      }catch(e){session.del(SESSION_KEY)}
    }
    render();
  }catch(err){
    $("#app").innerHTML=`<div class="card fatal"><h1 style="color:#172b4d;font-size:20px">Unable to start the portal</h1><p class="muted" style="margin-top:8px">${esc(err.message)}</p><p class="muted" style="margin-top:8px">Please allow browser storage and open this page over HTTPS or localhost.</p></div>`;
  }
})();
